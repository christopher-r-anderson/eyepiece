# no [dev] section since we use the netlify plugin for vite
[build]
  command = "pnpm build"
  publish = "dist/client"
  # exit 0 skips the build: CI builds the production deploy and uploads it
  # with netlify deploy after showcase provisioning; previews and branch
  # deploys keep building at push
  ignore = "test \"$CONTEXT\" = \"production\""
[build.environment]
  NODE_VERSION = "24"

# image CDN remote sources; no URL signing exists, so this stays as tight as
# the URL shapes allow. NASA is absent on purpose: its fetches route through
# the same-site edge function (netlify/edge-functions/nasa-image-source.ts).
# Kept in sync with PROVIDER_IMAGE_DELIVERY by its unit test.
[images]
  remote_images = [
    "https://ids\\.si\\.edu/ids/iiif/.*",
  ]

# safe with immutable because font files are pinned (scripts/fonts-manifest.json);
# an updated font must ship under a new filename
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
