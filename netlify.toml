# no [dev] section since we use the netlify plugin for vite
[build]
  command = "pnpm build"
  publish = "dist/client"
  # exit 0 skips the build: CI triggers production builds with a build hook
  # after showcase provisioning (hook builds skip this check); previews and
  # branch deploys keep building at push
  ignore = "test \"$CONTEXT\" = \"production\""
[build.environment]
  NODE_VERSION = "24"

# safe with immutable because font files are pinned (scripts/fonts-manifest.json);
# an updated font must ship under a new filename
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
