# local/CI runs use the repo's patched Netlify CLI (patches/netlify-cli.patch,
# see README "Running Locally"); production infrastructure is unaffected
# no [dev] section since we use the netlify plugin for vite
[build]
command = "pnpm build"
publish = "dist/client"
# exit 0 skips the build: CI builds the production deploy and uploads it
# with netlify deploy after showcase provisioning; previews and branch
# deploys keep building at push
ignore = "test \"$CONTEXT\" = \"production\""
[build.environment]
NODE_VERSION = "24"

# image CDN remote sources that do not pass through our edge functions
# keep patterns as restricted as possible to minimize abuse
[images]
remote_images = ["https://ids\\.si\\.edu/ids/iiif/.*"]

# safe with immutable because font files are pinned (scripts/fonts-manifest.json);
# an updated font must ship under a new filename
[[headers]]
for = "/fonts/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
