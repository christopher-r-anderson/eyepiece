name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # manual publish: re-provision showcase content or re-publish
  # without a throwaway commit
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format Check
        run: pnpm run format

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check
        run: pnpm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Tests
        run: pnpm test:unit

  integration-test:
    name: Integration Tests (Vitest + Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-format, type-check, test]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase (local)
        run: pnpm supabase start

      - name: Generate .env.test from Supabase
        run: pnpm -s print-supabase-env > .env.test

      - name: Run integration tests
        env:
          SI_OA_API_KEY: ${{ secrets.SI_OA_API_KEY }}
        run: pnpm test:integration

      - name: Stop Supabase
        if: ${{ always() }}
        run: pnpm supabase stop

  e2e:
    name: E2E (Playwright w/ Netlify + Supabase)
    runs-on: ubuntu-latest
    # generous while the suite grows; dial back once runtimes settle
    timeout-minutes: 60
    # e2e gates the publish on main; PR branches run the suite locally
    # before pushing instead of paying it on every review-round push
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    # TODO: run this in parallel with integration tests
    # this should already work on github, but locally with act this causes a docker conflict.
    # since this leaves us unable to test, we run sequentially for now
    # in the future we should fix this - possibly by using dynamic supabase project names
    # needs: [lint-and-format, type-check, test]
    needs: [integration-test]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Supabase (local)
        run: pnpm supabase start

      - name: Generate .env.local from Supabase
        run: pnpm -s print-supabase-env > .env.local

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers (and OS deps)
        run: pnpm exec playwright install --with-deps

      # no provider key: the suite replays recorded responses (#185)
      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Stop Supabase
        if: ${{ always() }}
        run: pnpm supabase stop

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  publish-netlify-prod:
    name: Publish
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check, test, integration-test, e2e]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.72.8

      - name: Link Supabase project (prod)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Supabase database migrations (prod)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Deploy Supabase config (prod)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase config push

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # before the Netlify publish so a homepage that links new showcase
      # content never goes live before that content exists; removed
      # collections are pruned only after the publish succeeds
      - name: Provision showcase content (prod)
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SHOWCASE_USER_EMAIL: ${{ secrets.SHOWCASE_USER_EMAIL }}
          SI_OA_API_KEY: ${{ secrets.SI_OA_API_KEY }}
        run: pnpm provision-showcase --phase=apply

      - name: Build production site
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SENTRY_ENABLED: ${{ vars.VITE_SENTRY_ENABLED }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ vars.VITE_SENTRY_ENVIRONMENT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm build

      # netlify deploy --prod refuses while the published deploy is locked;
      # lift the lock for the publish, the re-lock step below restores it
      - name: Unlock production publishing
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          published_id="$(pnpm -s netlify api getSite --data "{\"site_id\": \"${NETLIFY_SITE_ID}\"}" | jq -r '.published_deploy.id // empty')"
          if [ -n "$published_id" ]; then
            pnpm -s netlify api unlockDeploy --data "{\"deploy_id\": \"${published_id}\"}" > /dev/null
            echo "Unlocked ${published_id}"
          fi

      - name: Deploy Netlify production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: pnpm netlify deploy --prod --no-build --message "ci publish ${GITHUB_SHA}"

      # always() so an aborted publish never leaves the site unlocked;
      # re-locks whichever deploy is currently published
      - name: Re-lock production publishing
        if: ${{ always() }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          published_id="$(pnpm -s netlify api getSite --data "{\"site_id\": \"${NETLIFY_SITE_ID}\"}" | jq -r '.published_deploy.id // empty')"
          if [ -n "$published_id" ]; then
            pnpm -s netlify api lockDeploy --data "{\"deploy_id\": \"${published_id}\"}" > /dev/null
            echo "Locked ${published_id}"
          fi

      # after the publish so a failed publish never leaves the live homepage
      # linking a collection that has already been deleted
      - name: Prune removed showcase content (prod)
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SHOWCASE_USER_EMAIL: ${{ secrets.SHOWCASE_USER_EMAIL }}
        run: pnpm provision-showcase --phase=prune
