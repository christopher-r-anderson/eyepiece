name: Revalidate Snapshots

# weekly: the content is archival and the stale window is seven days, so
# every row refreshes on a one-to-two week rhythm (#205)
on:
  schedule:
    # off the hour: GitHub delays or drops runs scheduled on round times
    - cron: '13 6 * * 1'
  workflow_dispatch:

concurrency:
  group: revalidate-snapshots

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Revalidate snapshots (prod)
        env:
          VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SI_OA_API_KEY: ${{ secrets.SI_OA_API_KEY }}
        run: pnpm revalidate-snapshots
